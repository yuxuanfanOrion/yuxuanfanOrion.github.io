# JWST nebulae for the sidebar strip. One is picked at random on each visit
# (never the same as the previous visit). Each image is a ~1:3 vertical
# slice, 600px wide; ar is height / width.
# Star positions are percentages of the slice and should sit on real bright
# stars: hero scintillates, big get spikes, small get short spikes, glints blink.
# Only the middle ~60% of the width is visible on a laptop-sized strip.

